<main class="w-full min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 p-4">
  
  <section class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 space-y-6">
    
    <div class="text-center">
      <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Iniciar Sesión</h1>
      <p class="text-gray-500 dark:text-gray-400 mt-2">Gonis gonizas</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6" novalidate>
      
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Correo Electrónico</label>
        <div class="mt-1">
          <input formControlName="email" id="email" type="email" autocomplete="email" required
                 class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                 [ngClass]="{ 'border-red-500': f['email'].touched && f['email'].errors }">
        </div>
        <div *ngIf="f['email'].touched && f['email'].errors" class="text-red-500 text-sm mt-1">
          <span *ngIf="f['email'].errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="f['email'].errors?.['email']">Introduce un correo válido.</span>
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña</label>
        <div class="mt-1">
          <input formControlName="password" id="password" type="password" autocomplete="current-password" required
                 class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                 [ngClass]="{ 'border-red-500': f['password'].touched && f['password'].errors }">
        </div>
        <div *ngIf="f['password'].touched && f['password'].errors" class="text-red-500 text-sm mt-1">
          <span *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</span>
          <span *ngIf="f['password'].errors?.['minLength']">Debe tener al menos 6 caracteres.</span>
        </div>
      </div>

      <div class="text-right">
        <a href="#" class="text-sm text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300">¿Olvidaste la contraseña?</a>
      </div>

      @if (errorMessage) {
        <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg">
        {{ errorMessage }}
      </div>
    }
      
      <div>
        <button type="submit" [disabled]="isLoading"
                class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-300 disabled:cursor-not-allowed transition duration-150 ease-in-out">
          <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span *ngIf="!isLoading">Entrar</span>
          <span *ngIf="isLoading">Procesando...</span>
        </button>
      </div>

    </form>
  </section>
</main>
