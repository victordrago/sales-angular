<div class="flex flex-col h-screen bg-gray-50 dark:bg-gray-900">

  <app-header 
    (toggleLeft)="toggleLeftPanel()" 
    (toggleRight)="toggleRightPanel()">
  </app-header>
  
  <div class="flex flex-1 overflow-hidden">
    @if (showLeftPanel) {
      <app-left-panel class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700" />
    }
    <main class="flex-1 p-6 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (showRightPanel) {
  <div 
    (click)="toggleRightPanel()" 
    class="fixed inset-0 z-40 bg-black/50 cursor-pointer">
  </div>
}

@if (showRightPanel) {
  <app-right-panel />
}
