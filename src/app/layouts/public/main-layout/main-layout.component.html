<div class="flex flex-col h-screen bg-gray-50 dark:bg-gray-900">

  <app-header 
    (toggleLeft)="toggleLeftPanel()" 
    (toggleRight)="toggleRightPanel()">
  </app-header>
  
  <div class="flex flex-1 overflow-hidden">
    @if (showLeftPanel) {
      <app-left-panel class="w-1/5 bg-blue-50 border-r border-gray-200" />
    }
    <main class="flex-1 p-6 overflow-y-auto">
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
        @for (item of searchResults; track item.title) {
          <app-card [data]="item"></app-card>
        }
      </div>
    </main>
  </div>
</div>

@if (showRightPanel) {
  <div 
    (click)="toggleRightPanel()" 
    class="fixed inset-0 z-40 bg-black/50 cursor-pointer">
  </div>
}

@if (showRightPanel) {
  <app-right-panel />
}
