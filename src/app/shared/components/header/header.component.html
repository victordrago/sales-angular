<header class="bg-white shadow dark:bg-gray-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      <!-- Logo -->
      <div class="flex-shrink-0 text-xl font-bold text-indigo-600 dark:text-indigo-400">
        SalesApp
      </div>

      <!-- Navigation -->
      <nav class="hidden md:flex space-x-4">
        <a href="#" class="text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400">Inicio</a>
        <a href="#" class="text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400">Ventas</a>
        <a href="#" class="text-gray-700 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400">Clientes</a>
      </nav>

      <!-- Botón de acción -->
      <div class="hidden md:flex items-center space-x-4">
        <button class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
          Login
        </button>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" class="text-gray-700 dark:text-gray-200 focus:outline-none">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="isMenuOpen" class="md:hidden px-4 pb-4 space-y-2">
    <a href="#" class="block text-gray-700 dark:text-gray-200 hover:text-indigo-600">Inicio</a>
    <a href="#" class="block text-gray-700 dark:text-gray-200 hover:text-indigo-600">Ventas</a>
    <a href="#" class="block text-gray-700 dark:text-gray-200 hover:text-indigo-600">Clientes</a>
    <button class="w-full bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
      Login
    </button>
  </div>
</header>
