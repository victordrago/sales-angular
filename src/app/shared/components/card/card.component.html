<div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
  <img class="w-full h-48 object-cover" [src]="data.imageUrl" [alt]="data.title">
  <div class="p-6">
    <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">{{ data.title }}</h3>
    <p class="text-gray-600 dark:text-gray-300 mb-4">{{ data.description }}</p>
    <div class="flex flex-wrap gap-2">
      @for (tag of data.tags; track tag) {
        <span class="bg-indigo-100 text-indigo-800 text-xs font-medium px-2.5 py-0.5 rounded-full
                     dark:bg-indigo-900 dark:text-indigo-300">
          {{ tag }}
        </span>
      }
    </div>
  </div>
</div>
